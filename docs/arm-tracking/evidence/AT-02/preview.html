<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AT-02 腕と手の動きの見本</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eef3f6;
        color: #183346;
        font-family: 'Yu Gothic UI', Meiryo, sans-serif;
      }
      main {
        max-width: 1320px;
        margin: auto;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 26px;
      }
      p {
        line-height: 1.65;
        margin: 8px 0;
      }
      .muted {
        color: #526779;
        font-size: 13px;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 310px;
        gap: 20px;
        margin-top: 18px;
      }
      .stage,
      aside {
        border: 1px solid #cbd8e0;
        border-radius: 14px;
        background: #fff;
        padding: 16px;
      }
      svg {
        width: 100%;
        background: #f7fafb;
        border-radius: 10px;
        touch-action: none;
      }
      .legend {
        display: flex;
        gap: 24px;
        font-weight: bold;
      }
      .left {
        color: #087f8c;
      }
      .right {
        color: #b95624;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
      }
      select,
      button {
        font: inherit;
        padding: 8px;
        border: 1px solid #9db2bf;
        border-radius: 6px;
        background: white;
        color: inherit;
      }
      button {
        cursor: pointer;
        background: #183346;
        color: #fff;
      }
      label {
        display: block;
        margin: 8px 0;
        font-size: 14px;
      }
      input[type='range'] {
        display: block;
        width: 100%;
        accent-color: #087f8c;
      }
      label output {
        float: right;
        font-variant-numeric: tabular-nums;
      }
      fieldset {
        border: 1px solid #d9e3e9;
        border-radius: 8px;
        margin: 0 0 14px;
        padding: 10px 14px;
      }
      legend {
        font-weight: bold;
        font-size: 14px;
      }
      #status {
        display: block;
        white-space: pre-line;
        font-size: 13px;
        line-height: 1.7;
        min-height: 72px;
      }
      @media (max-width: 850px) {
        main {
          padding: 14px;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        aside {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        fieldset {
          margin: 0;
        }
      }
      @media (max-width: 480px) {
        aside {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>腕と手の動きの見本</h1>
      <p>肘の曲がる側と掌の向きを固定した、カメラを使わない技術試作です。関節・手形・親の動きを試せます。</p>
      <p class="muted">AT-02 / CO補助確認用。実キャラクターの継ぎ目や、カメラ追従の自然さは後続カードで確認します。</p>
      <div class="layout">
        <section class="stage" aria-label="動きのプレビュー">
          <div class="toolbar">
            <label
              >姿勢
              <select id="preset"></select></label
            ><button id="play" aria-pressed="false">手振りを再生</button
            ><label><input id="guides" type="checkbox" checked />関節を表示</label>
          </div>
          <div class="legend">
            <span class="right">画面左：モデルの右腕 R</span><span class="left">画面右：モデルの左腕 L</span>
          </div>
          <svg id="scene" viewBox="-430 -120 860 680" role="img" aria-label="腕と手の技術見本"></svg>
          <output id="status"></output>
        </section>
        <aside aria-label="姿勢の調整">
          <fieldset>
            <legend class="left">モデルの左腕 L</legend>
            <div id="left-angles"></div>
            <label
              >手の形
              <select id="left-hand"></select
            ></label>
          </fieldset>
          <fieldset>
            <legend class="right">モデルの右腕 R</legend>
            <div id="right-angles"></div>
            <label
              >手の形
              <select id="right-hand"></select
            ></label>
          </fieldset>
          <fieldset>
            <legend>胴体から継承する動き</legend>
            <label
              >回転（度）<output id="rotation-value"></output
              ><input id="rotation" type="range" min="-25" max="25" step="1" value="0"
            /></label>
            <label
              >等倍率<output id="scale-value"></output
              ><input id="scale" type="range" min="0.65" max="1.25" step="0.01" value="1"
            /></label>
            <label
              >呼吸の移動（px）<output id="breath-value"></output
              ><input id="breath" type="range" min="-8" max="8" step="0.5" value="0"
            /></label>
          </fieldset>
        </aside>
      </div>
      <p class="muted">
        骨長：上腕118px・前腕108px。数値は制約適用後。ドラッグは試作用の有界探索を使います。製品の追従処理や性能評価ではありません。
      </p>
    </main>
    <script>
      'use strict';
      (() => {
        // prototypes/arm-tracking/rig/kinematics.ts
        var RIG = {
          upperLength: 118,
          lowerLength: 108,
          shoulderX: 78,
          shoulderY: 240,
          shoulder: [-25, 160],
          elbow: [0, 145],
          wrist: [-40, 40],
          forearm: [-25, 300],
          hand: [-55, 300],
        };
        var REST = { shoulder: 8, elbow: 12, wrist: 0 };
        var IDENTITY_PARENT = { rotation: 0, scale: 1, breath: 0 };
        var HAND_SHAPES = ['open', 'fist', 'point', 'peace'];
        var RAD = Math.PI / 180;
        var clamp = (n2, lo, hi) => Math.max(lo, Math.min(hi, n2));
        var distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        function constrain(input) {
          if (![input.shoulder, input.elbow, input.wrist].every(Number.isFinite))
            return {
              pose: { ...REST },
              reasons: ['\u975E\u6709\u9650\u306E\u5165\u529B\uFF1A\u4F11\u6B62\u59FF\u52E2'],
            };
          const shoulder = clamp(input.shoulder, ...RIG.shoulder);
          const elbow = clamp(
            input.elbow,
            Math.max(RIG.elbow[0], RIG.forearm[0] - shoulder),
            Math.min(RIG.elbow[1], RIG.forearm[1] - shoulder),
          );
          const forearm = shoulder + elbow;
          const wrist = clamp(
            input.wrist,
            Math.max(RIG.wrist[0], RIG.hand[0] - forearm),
            Math.min(RIG.wrist[1], RIG.hand[1] - forearm),
          );
          const pose = { shoulder, elbow, wrist };
          const reasons = [];
          if (shoulder !== input.shoulder) reasons.push('\u80A9\u306E\u7BC4\u56F2');
          if (elbow !== input.elbow) reasons.push('\u8098\u30FB\u524D\u8155\u306E\u7BC4\u56F2');
          if (wrist !== input.wrist) reasons.push('\u624B\u9996\u30FB\u624B\u306E\u5408\u6210\u89D2\u5EA6');
          return { pose, reasons };
        }
        function forward(pose, side) {
          const sign = side === 'L' ? 1 : -1;
          const shoulder = { x: sign * RIG.shoulderX, y: RIG.shoulderY };
          const segment = (p2, angle, length) => ({
            x: p2.x + sign * Math.sin(angle * RAD) * length,
            y: p2.y + Math.cos(angle * RAD) * length,
          });
          const elbow = segment(shoulder, pose.shoulder, RIG.upperLength);
          const wrist = segment(elbow, pose.shoulder + pose.elbow, RIG.lowerLength);
          return { shoulder, elbow, wrist, handRotation: sign * (180 - pose.shoulder - pose.elbow - pose.wrist) };
        }
        function toWorld(p2, parent) {
          if (
            !Number.isFinite(parent.scale) ||
            parent.scale <= 0 ||
            !Number.isFinite(parent.rotation) ||
            !Number.isFinite(parent.breath)
          )
            throw new Error(
              '\u89AA\u306F\u6709\u9650\u306E\u56DE\u8EE2\u3068\u6B63\u306E\u7B49\u500D\u7387\u306B\u9650\u308B',
            );
          const c = Math.cos(parent.rotation * RAD),
            s = Math.sin(parent.rotation * RAD);
          const x = p2.x * parent.scale,
            y = (p2.y - 260 - parent.breath) * parent.scale;
          return { x: c * x - s * y, y: 260 + s * x + c * y };
        }
        function fromWorld(p2, parent) {
          toWorld({ x: 0, y: 0 }, parent);
          const c = Math.cos(parent.rotation * RAD),
            s = Math.sin(parent.rotation * RAD);
          return {
            x: (c * p2.x + s * (p2.y - 260)) / parent.scale,
            y: (-s * p2.x + c * (p2.y - 260)) / parent.scale + 260 + parent.breath,
          };
        }
        function solveTarget(target, side, requestedWrist = 0, previous) {
          if (![target.x, target.y, requestedWrist].every(Number.isFinite))
            return {
              pose: { ...REST },
              error: 0,
              limited: true,
              reason: '\u7121\u52B9\u306A\u76EE\u6A19\uFF1A\u4F11\u6B62\u59FF\u52E2',
            };
          let best = constrain(previous ?? REST).pose,
            bestCost = Infinity;
          const consider = (shoulder, elbow) => {
            const candidate = constrain({ shoulder, elbow, wrist: requestedWrist }).pose;
            const positionError = distance(forward(candidate, side).wrist, target);
            const previousCost = previous
              ? 0.015 * ((candidate.shoulder - previous.shoulder) ** 2 + (candidate.elbow - previous.elbow) ** 2)
              : 0;
            const cost = positionError ** 2 + previousCost;
            if (cost < bestCost) {
              bestCost = cost;
              best = candidate;
            }
          };
          for (let s = RIG.shoulder[0]; s <= RIG.shoulder[1]; s += 2)
            for (let e = RIG.elbow[0]; e <= RIG.elbow[1]; e += 2) consider(s, e);
          for (const s of RIG.shoulder) for (const e of RIG.elbow) consider(s, e);
          for (const step of [0.2, 0.02]) {
            const center = { ...best };
            for (let ds = -10; ds <= 10; ds++)
              for (let de = -10; de <= 10; de++) consider(center.shoulder + ds * step, center.elbow + de * step);
          }
          const error = distance(forward(best, side).wrist, target);
          return {
            pose: best,
            error,
            limited: error > 1,
            reason:
              error > 1
                ? '\u53EF\u52D5\u57DF\u3092\u512A\u5148\uFF1A\u76EE\u6A19\u3078\u306E\u8AA4\u5DEE\u3042\u308A'
                : '\u76EE\u6A19\u4ED8\u8FD1',
          };
        }
        var p = (shoulder, elbow, wrist = 0) => ({ shoulder, elbow, wrist });
        var scene = (name, left, right = left, leftHand = 'open', rightHand = leftHand, parent = IDENTITY_PARENT) => ({
          name,
          left,
          right,
          leftHand,
          rightHand,
          parent,
        });
        var POSES = [
          scene('\u4F11\u6B62\u59FF\u52E2', REST),
          scene('\u8098 0\xB0', p(55, 0)),
          scene('\u8098 45\xB0', p(55, 45)),
          scene('\u8098 90\xB0', p(55, 90)),
          scene('\u8098 145\xB0', p(55, 145)),
          scene('\u624B\u632F\u308A\u30FB\u5DE6', p(65, 100, -25), REST),
          scene('\u5DE6\u53F3\u3078\u6307\u3055\u3059', p(90, 0), p(90, 0), 'point'),
          scene('\u4E0A\u3078\u6307\u3055\u3059', p(160, 20), REST, 'point', 'open'),
          scene('\u9854\u306E\u524D\u306E\u30D4\u30FC\u30B9', p(110, 130, -30), p(110, 130, -30), 'peace'),
          scene('\u30B0\u30FC\u3068\u30D1\u30FC', p(60, 110, 10), p(60, 110, 10), 'fist', 'open'),
          scene('\u624B\u9996\u306E\u4E21\u7AEF', p(65, 100, -40), p(65, 100, 40)),
          scene('\u8907\u5408\u89D2\u5EA6\u306E\u5236\u9650', p(160, 145, 40)),
          scene('\u80A9\u306E\u4E0B\u9650', p(-25, 0, -40)),
          scene('\u89AA\u306E\u50BE\u304D\u30FB\u547C\u5438', p(110, 130, -30), p(65, 100, 15), 'peace', 'open', {
            rotation: 12,
            scale: 0.85,
            breath: 6,
          }),
          scene('\u5DE6\u53F3\u306E\u7570\u306A\u308B\u624B\u5F62', p(65, 100), p(65, 100), 'point', 'peace'),
          scene('\u57FA\u6E96\u89D2\u3092\u6301\u3064\u8155', p(25, 65, 10), p(25, 65, 10), 'fist'),
        ];
        function waveAt(time) {
          const phase = time * Math.PI * 2;
          return scene(
            '\u9023\u7D9A\u624B\u632F\u308A\uFF081Hz\uFF09',
            p(65 + 6 * Math.sin(phase), 100 + 10 * Math.sin(phase), 25 * Math.cos(phase)),
            p(65 + 6 * Math.sin(phase + Math.PI), 100 + 10 * Math.sin(phase + Math.PI), 25 * Math.cos(phase + Math.PI)),
          );
        }

        // prototypes/arm-tracking/rig/render.ts
        var COLORS = { L: '#087f8c', R: '#cf6a37', ink: '#183346' };
        var n = (v) => Number(v.toFixed(4));
        var HAND_DATA = {
          L: {
            fingers: [
              { x: -12, length: 39 },
              { x: -3, length: 48 },
              { x: 7, length: 43 },
              { x: 16, length: 31 },
            ],
            thumb: 'M -15 -13 L -34 -30 Q -39 -38 -33 -41 Q -28 -44 -23 -35 L -12 -29 Z',
            thumbDot: -31,
            index: 0,
            middle: 1,
          },
          R: {
            fingers: [
              { x: -16, length: 30 },
              { x: -7, length: 42 },
              { x: 3, length: 47 },
              { x: 12, length: 40 },
            ],
            thumb: 'M 15 -13 L 34 -31 Q 40 -38 33 -42 Q 28 -45 23 -35 L 12 -29 Z',
            thumbDot: 31,
            index: 3,
            middle: 2,
          },
        };
        function handSvg(side, shape) {
          const data = HAND_DATA[side],
            color = COLORS[side];
          const fingers = data.fingers
            .map((f, i) => {
              const extended =
                shape === 'open' ||
                (shape === 'point' && i === data.index) ||
                (shape === 'peace' && (i === data.index || i === data.middle));
              const length = extended ? f.length : 9;
              const spread =
                shape === 'peace' && extended
                  ? i === data.index
                    ? side === 'L'
                      ? -12
                      : 12
                    : side === 'L'
                      ? 12
                      : -12
                  : 0;
              return `<g transform="translate(${f.x} -35) rotate(${spread})"><rect x="-4" y="${-length}" width="8" height="${length + 8}" rx="4" fill="#f6dcc8" stroke="${color}" stroke-width="1.8"/></g>`;
            })
            .join('');
          return `${fingers}<path d="M -13 3 L -20 -28 Q -21 -42 -13 -43 L 13 -43 Q 22 -40 20 -28 L 13 3 Z" fill="#f6dcc8" stroke="${color}" stroke-width="2.5"/>
    <path d="${data.thumb}" fill="#f6dcc8" stroke="${color}" stroke-width="2"/>
    <circle cx="${data.thumbDot}" cy="-36" r="2.7" fill="#ac2871"/>
    <path d="M -9 -11 Q 0 -23 11 -19 M -9 -28 Q -3 -34 8 -29" fill="none" stroke="${color}" stroke-width="1.5"/>
    <text x="0" y="-15" text-anchor="middle" font-size="11" font-weight="bold" fill="${color}">${side}</text>`;
        }
        function sceneContent(scene2, guides = true) {
          toWorld({ x: 0, y: 0 }, scene2.parent);
          const left = constrain(scene2.left).pose,
            right = constrain(scene2.right).pose;
          const arms = ['L', 'R'].map((side) => ({
            side,
            pose: side === 'L' ? left : right,
            arm: forward(side === 'L' ? left : right, side),
            shape: side === 'L' ? scene2.leftHand : scene2.rightHand,
          }));
          const upper = arms
            .map(
              ({ side, arm }) =>
                `<line x1="${n(arm.shoulder.x)}" y1="${n(arm.shoulder.y)}" x2="${n(arm.elbow.x)}" y2="${n(arm.elbow.y)}" stroke="${COLORS[side]}" stroke-width="35" stroke-linecap="round"/>`,
            )
            .join('');
          const lower = arms
            .map(
              ({ arm }) =>
                `<line x1="${n(arm.elbow.x)}" y1="${n(arm.elbow.y)}" x2="${n(arm.wrist.x)}" y2="${n(arm.wrist.y)}" stroke="${COLORS.ink}" stroke-width="27" stroke-linecap="round"/><line x1="${n(arm.elbow.x)}" y1="${n(arm.elbow.y)}" x2="${n(arm.wrist.x)}" y2="${n(arm.wrist.y)}" stroke="#f6dcc8" stroke-width="23" stroke-linecap="round"/>`,
            )
            .join('');
          const hands = arms
            .map(
              ({ side, arm, shape }) =>
                `<g data-hand="${side}" transform="translate(${n(arm.wrist.x)} ${n(arm.wrist.y)}) rotate(${n(arm.handRotation)})">${handSvg(side, shape)}</g>`,
            )
            .join('');
          const guide = !guides
            ? ''
            : arms
                .map(({ side, arm }) => {
                  const points = [arm.shoulder, arm.elbow, arm.wrist];
                  return (
                    `<polyline points="${points.map((p2) => `${n(p2.x)},${n(p2.y)}`).join(' ')}" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="4 5"/>` +
                    points
                      .map(
                        (p2, i) =>
                          `<circle cx="${n(p2.x)}" cy="${n(p2.y)}" r="4" fill="white" stroke="${COLORS.ink}" stroke-width="1.5"/><text x="${n(p2.x + 7)}" y="${n(p2.y + 10)}" font-size="10" fill="${COLORS.ink}">${side}${['S', 'E', 'W'][i]}</text>`,
                      )
                      .join('')
                  );
                })
                .join('');
          const parent = scene2.parent;
          return `<g font-family="Meiryo" transform="translate(0 260) rotate(${parent.rotation}) scale(${parent.scale}) translate(0 ${-260 - parent.breath})">
    <path d="M -73 217 Q -98 246 -87 430 L 87 430 Q 98 246 73 217 Z" fill="#dce6ec" stroke="#8ca2b3" stroke-width="2"/>
    ${upper}
    <path d="M -24 190 L -24 223 Q 0 238 24 223 L 24 190" fill="#f6dcc8" stroke="#ad9789" stroke-width="2"/>
    <ellipse cx="0" cy="120" rx="83" ry="92" fill="#f3e8d9" stroke="#8ca2b3" stroke-width="2"/>
    <path d="M -79 100 Q -78 23 0 26 Q 79 24 80 100 L 39 80 L 20 104 L -3 79 L -27 105 L -49 81 Z" fill="#b3c3ce"/>
    <path d="M -44 127 Q -30 119 -16 127 M 16 127 Q 30 119 44 127 M -15 162 Q 0 174 15 162" fill="none" stroke="#526779" stroke-width="3"/>
    ${lower}${hands}${guide}
  </g>`;
        }

        // prototypes/arm-tracking/rig/viewer.ts
        var element = (id) => {
          const result = document.getElementById(id);
          if (!result) throw new Error(`Missing element: ${id}`);
          return result;
        };
        var canvas = element('scene');
        var preset = element('preset');
        var play = element('play');
        var status = element('status');
        var current = structuredClone(POSES[0]);
        var playing = false;
        var startedAt = 0;
        var frame = 0;
        var dragSide = null;
        var targetMessage = '';
        preset.innerHTML = POSES.map((p2, i) => `<option value="${i}">${p2.name}</option>`).join('');
        var labels = {
          open: '\u30D1\u30FC',
          fist: '\u30B0\u30FC',
          point: '\u6307\u3055\u3057',
          peace: '\u30D4\u30FC\u30B9',
        };
        for (const side of ['left', 'right']) {
          element(`${side}-hand`).innerHTML = HAND_SHAPES.map(
            (shape) => `<option value="${shape}">${labels[shape]}</option>`,
          ).join('');
          const container = element(`${side}-angles`);
          for (const [key, label] of [
            ['shoulder', '\u80A9'],
            ['elbow', '\u8098'],
            ['wrist', '\u624B\u9996'],
          ]) {
            container.insertAdjacentHTML(
              'beforeend',
              `<label>${label}<output id="${side}-${key}-value"></output><input id="${side}-${key}" type="range" min="${RIG[key][0]}" max="${RIG[key][1]}" step="1" aria-label="${side === 'left' ? '\u5DE6' : '\u53F3'}${label}"></label>`,
            );
            element(`${side}-${key}`).addEventListener('input', (event) => {
              stop();
              current[side][key] = Number(event.target.value);
              targetMessage = '';
              render();
            });
          }
          element(`${side}-hand`).addEventListener('change', (event) => {
            current[side === 'left' ? 'leftHand' : 'rightHand'] = event.target.value;
            render();
          });
        }
        for (const key of ['rotation', 'scale', 'breath']) {
          element(key).addEventListener('input', (event) => {
            current.parent[key] = Number(event.target.value);
            render();
          });
        }
        element('guides').addEventListener('change', render);
        preset.addEventListener('change', () => {
          stop();
          current = structuredClone(POSES[Number(preset.value)]);
          targetMessage = '';
          render();
        });
        function stop() {
          playing = false;
          cancelAnimationFrame(frame);
          play.textContent = '\u624B\u632F\u308A\u3092\u518D\u751F';
          play.setAttribute('aria-pressed', 'false');
        }
        function animate(now) {
          if (!playing) return;
          const wave = waveAt((now - startedAt) / 1e3);
          current.left = wave.left;
          current.right = wave.right;
          render();
          frame = requestAnimationFrame(animate);
        }
        play.addEventListener('click', () => {
          if (playing) {
            stop();
            return;
          }
          playing = true;
          startedAt = performance.now();
          targetMessage = '';
          play.textContent = '\u624B\u632F\u308A\u3092\u505C\u6B62';
          play.setAttribute('aria-pressed', 'true');
          frame = requestAnimationFrame(animate);
        });
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) stop();
        });
        function render() {
          canvas.innerHTML = sceneContent(current, element('guides').checked);
          const messages = [];
          for (const side of ['left', 'right']) {
            const { pose, reasons } = constrain(current[side]);
            const a = forward(pose, side === 'left' ? 'L' : 'R');
            const s = toWorld(a.shoulder, current.parent),
              e = toWorld(a.elbow, current.parent),
              w = toWorld(a.wrist, current.parent);
            for (const key of ['shoulder', 'elbow', 'wrist']) {
              element(`${side}-${key}`).value = String(current[side][key]);
              element(`${side}-${key}-value`).value = `${pose[key].toFixed(1)}\xB0`;
            }
            element(`${side}-hand`).value = current[side === 'left' ? 'leftHand' : 'rightHand'];
            messages.push(
              `${side === 'left' ? 'L' : 'R'} \u9AA8\u9577 ${distance(s, e).toFixed(2)} / ${distance(e, w).toFixed(2)}${reasons.length ? `  \u5236\u9650: ${reasons.join('\u30FB')}` : ''}`,
            );
          }
          for (const key of ['rotation', 'scale', 'breath']) {
            element(key).value = String(current.parent[key]);
            element(`${key}-value`).value = String(Number(current.parent[key].toFixed(2)));
          }
          status.value = `${messages.join('\n')}
${targetMessage || '\u638C\u306E\u89AA\u6307\u306E\u76EE\u5370\u306F\u56FA\u5B9A\u3002\u624B\u9996\u306E\u767D\u3044\u70B9\u3092\u30C9\u30E9\u30C3\u30B0\u3067\u304D\u307E\u3059\u3002'}`;
        }
        function eventPoint(event) {
          const matrix = canvas.getScreenCTM();
          if (!matrix) return null;
          const p2 = new DOMPoint(event.clientX, event.clientY).matrixTransform(matrix.inverse());
          return { x: p2.x, y: p2.y };
        }
        canvas.addEventListener('pointerdown', (event) => {
          const p2 = eventPoint(event);
          if (!p2) return;
          let nearest = Infinity;
          for (const side of ['L', 'R']) {
            const pose = constrain(side === 'L' ? current.left : current.right).pose;
            const d = distance(p2, toWorld(forward(pose, side).wrist, current.parent));
            if (d < 30 && d < nearest) {
              nearest = d;
              dragSide = side;
            }
          }
          if (dragSide) {
            stop();
            canvas.setPointerCapture(event.pointerId);
            event.preventDefault();
          }
        });
        canvas.addEventListener('pointermove', (event) => {
          if (!dragSide) return;
          const p2 = eventPoint(event);
          if (!p2) return;
          const key = dragSide === 'L' ? 'left' : 'right';
          const previous = constrain(current[key]).pose;
          const result = solveTarget(fromWorld(p2, current.parent), dragSide, previous.wrist, previous);
          current[key] = result.pose;
          targetMessage = `${dragSide}: ${result.reason}\uFF08\u76EE\u6A19\u3068\u306E\u8DDD\u96E2 ${result.error.toFixed(1)}px\uFF09`;
          render();
        });
        canvas.addEventListener('pointerup', () => {
          dragSide = null;
        });
        canvas.addEventListener('pointercancel', () => {
          dragSide = null;
        });
        render();
      })();
    </script>
  </body>
</html>
