<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AT-01 推定の試作</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        font-family: 'Meiryo', sans-serif;
        font-size: 13px;
      }
      body {
        margin: 0;
        background: #1b1d21;
        color: #e8e8e8;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        grid-template-rows: auto minmax(0, 1fr);
        height: 100vh;
        overflow: hidden;
      }
      #load {
        grid-column: 1;
        grid-row: 1 / 3;
        width: 100%;
        height: 100%;
      }
      #side {
        grid-column: 2;
        grid-row: 1 / 3;
        overflow: auto;
        padding: 8px;
        border-left: 1px solid #333;
      }
      #overlay {
        width: 100%;
        aspect-ratio: 4 / 3;
        background: #111;
      }
      label {
        display: grid;
        grid-template-columns: 7em minmax(0, 1fr);
        align-items: center;
        gap: 4px;
        margin: 3px 0;
      }
      select,
      input[type='number'] {
        min-width: 0;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 6px 0;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        margin: 4px 0;
      }
      #log {
        max-height: 200px;
        overflow: auto;
        color: #aaa;
      }
      #prompt {
        position: fixed;
        left: 16px;
        right: 376px;
        top: 16px;
        padding: 16px;
        background: rgba(0, 0, 0, 0.85);
        font-size: 18px;
        line-height: 1.5;
        white-space: pre-line;
        border: 4px solid #555;
        border-radius: 8px;
        z-index: 10;
      }
      #prompt .action {
        font-size: 34px;
        font-weight: bold;
        color: #ffe066;
      }
      #prompt.recording {
        border-color: #ff4d4d;
      }
      /* 案内つき収録の間は、鏡像のプレビューを大きく出す */
      body.guided #overlay {
        position: fixed;
        left: 16px;
        top: 200px;
        width: min(calc(100vw - 408px), calc((100vh - 216px) * 4 / 3));
        z-index: 5;
      }
    </style>
  </head>
  <body>
    <canvas id="load" aria-label="合成の描画負荷"></canvas>
    <div id="side">
      <canvas id="overlay" width="480" height="360" aria-label="推定のプレビュー"></canvas>
      <label
        >カメラ
        <select id="camera"></select
      ></label>
      <label
        >解像度
        <select id="size">
          <option>640x480</option>
          <option>1280x720</option>
          <option>1920x1080</option>
        </select></label
      >
      <label
        >fps
        <select id="fps">
          <option>30</option>
          <option>60</option>
        </select></label
      >
      <label
        >推定
        <select id="mode">
          <option value="face">顔のみ</option>
          <option value="face+pose">顔＋Pose</option>
          <option value="face+pose+hands" selected>顔＋Pose＋手</option>
          <option value="pose+hands">Pose＋手（顔なし）</option>
        </select></label
      >
      <label
        >手の頻度
        <select id="handHz">
          <option value="30">30fps（通常）</option>
          <option value="15">15fps（軽量案）</option>
        </select></label
      >
      <label
        >Pose
        <select id="poseModel">
          <option>lite</option>
          <option>full</option>
        </select></label
      >
      <label
        >Worker
        <select id="delegate">
          <option>GPU</option>
          <option>CPU</option>
        </select></label
      >
      <label
        >Worker 数
        <select id="workers">
          <option value="1">1（Pose→手の順）</option>
          <option value="2">2（Pose と手を並行）</option>
        </select></label
      >
      <label
        >受け渡し
        <select id="transfer">
          <option value="videoframe">VideoFrame</option>
          <option value="imagebitmap">ImageBitmap</option>
        </select></label
      >
      <label>描画負荷 <input id="load-parts" type="number" min="0" max="400" step="20" value="120" /></label>
      <label
        >プレビュー <span><input id="mirror" type="checkbox" checked /> 左右反転（表示だけ）</span></label
      >
      <label
        >異常系
        <select id="simulate">
          <option value="none">なし</option>
          <option value="gpu-fail">GPU 初期化の失敗</option>
          <option value="gesture-fail">手のモデルが無い</option>
          <option value="worker-fail">Worker を読めない</option>
          <option value="transfer-fail">画像の受け渡しの失敗</option>
        </select></label
      >
      <div class="buttons">
        <button id="start">開始</button>
        <button id="stop">停止</button>
        <button id="measure">計測</button>
        <button id="guided">案内つき収録</button>
        <button id="probe">CSP の確認</button>
      </div>
      <pre id="stats"></pre>
      <pre id="log"></pre>
    </div>
    <div id="prompt" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
